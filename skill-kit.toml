manifest_version = 1
name        = "uv-suite"
description = "Spec, architecture, review and test workflows for coding agents: 12 skills, 8 agents, 6 hooks, 6 guardrails, 4 personas, a review flow and a feature flow"
version     = "0.34.0"
author      = "utsavanand"
homepage    = "https://github.com/utsavanand/uv-suite"
license     = "MIT"
conflicts_with = []
teams = ["teams/uv-coding.toml"]

# A persona tunes model, effort, permissions, hooks and guardrails together (personas.md).
[options.persona]
default = "professional"
choices = ["professional", "sport", "auto", "spike"]

# ── knowledge ────────────────────────────────────────────────────────────────
[[components]]
kind = "knowledge"
path = "knowledge/practices.md"

[[components]]
kind = "knowledge"
path = "knowledge/human-in-the-loop.md"
load = "on-demand"
description = "Cycle budgets, intervention types and learning loops: the HITL framework every gate follows"

[[components]]
kind = "knowledge"
path = "knowledge/sharing-and-standards.md"
load = "on-demand"
description = "Danger zones, team standards and sharing levels for using the suite across a team"

[[components]]
kind = "knowledge"
path = "acts-methodology.md"
load = "on-demand"
description = "The ACTS methodology behind the suite: read when asked how the skills fit together"

# guardrails: anti-slop rules read while writing code; which personas get them follows personas.md
[[components]]
kind = "knowledge"
path = "guardrails/architecture-slop.md"
load = { paths = ["**/*"] }
when = { persona = ["professional", "auto"] }

[[components]]
kind = "knowledge"
path = "guardrails/comment-slop.md"
load = { paths = ["**/*"] }
when = { persona = ["professional", "auto"] }

[[components]]
kind = "knowledge"
path = "guardrails/error-handling-slop.md"
load = { paths = ["**/*"] }
when = { persona = ["professional", "auto"] }

[[components]]
kind = "knowledge"
path = "guardrails/overengineering-slop.md"
load = { paths = ["**/*"] }
when = { persona = ["professional", "auto"] }

[[components]]
kind = "knowledge"
path = "guardrails/test-slop.md"
load = { paths = ["**/*"] }
when = { persona = ["professional", "auto"] }

[[components]]
kind = "knowledge"
path = "guardrails/doc-slop.md"
load = { paths = ["**/*.md", "**/*.txt", "**/*.rst"] }
when = { persona = ["professional", "auto", "spike"] }

# ── skills ───────────────────────────────────────────────────────────────────
[[components]]
kind = "skill"
path = "skills/uvs-spec"
effects = "workspace"
outputs = { spec = { file = "uv-out/spec.md" } }

[[components]]
kind = "skill"
path = "skills/uvs-architect"
effects = "workspace"
inputs  = { spec = "file" }
outputs = { plan = { file = "uv-out/architecture.md" } }

[[components]]
kind = "skill"
path = "skills/uvs-prototype"
effects = "workspace"
inputs  = { plan = "file" }
outputs = { changes = { file = "uv-out/changes.md" } }

[[components]]
kind = "skill"
path = "skills/uvs-test"
effects = "workspace"

[[components]]
kind = "skill"
path = "skills/uvs-review"
effects = "read-only"
inputs  = { diff = "file" }
outputs = { verdict = { choice = ["approve", "revise", "reject"] }, findings = { file = "uv-out/review-findings.md" } }

[[components]]
kind = "skill"
path = "skills/uvs-qa"
effects = "read-only"
inputs  = { diff = "file" }
outputs = { verdict = { choice = ["pass", "fail"] }, report = { file = "uv-out/qa-report.md" } }

[[components]]
kind = "skill"
path = "skills/uvs-understand"
effects = "read-only"

[[components]]
kind = "skill"
path = "skills/uvs-investigate"
effects = "read-only"

[[components]]
kind = "skill"
path = "skills/uvs-commit"
effects = "workspace"
invocation = "user"

[[components]]
kind = "skill"
path = "skills/uvs-session"
effects = "workspace"
invocation = "user"

[[components]]
kind = "skill"
path = "skills/uvs-help"
effects = "read-only"
invocation = "user"

[[components]]
kind = "skill"
path = "skills/uvs-lite"
effects = "read-only"
invocation = "user"

# ── agents (the canonical Claude Code definitions; adapters render Codex and others) ──
[[components]]
kind = "agent"
path = "agents/claude-code/anti-slop-guard.md"

[[components]]
kind = "agent"
path = "agents/claude-code/architect.md"

[[components]]
kind = "agent"
path = "agents/claude-code/cartographer.md"

[[components]]
kind = "agent"
path = "agents/claude-code/eval-writer.md"

[[components]]
kind = "agent"
path = "agents/claude-code/prototype-builder.md"

[[components]]
kind = "agent"
path = "agents/claude-code/reviewer.md"

[[components]]
kind = "agent"
path = "agents/claude-code/spec-writer.md"

[[components]]
kind = "agent"
path = "agents/claude-code/test-writer.md"

# ── hooks: one neutral script each (hooks/kit/), which personas get them follows personas.md ──
[[components]]
kind = "hook"
name = "block_destructive"
event = "before_tool"
match = "shell"
command = "hooks/kit/block-destructive.sh"
blocking = true
timeout = 5
when = { persona = ["professional", "auto"] }

[[components]]
kind = "hook"
name = "danger_zone_write"
event = "before_tool"
match = "write"
command = "hooks/kit/danger-zone-check.sh"
blocking = false
timeout = 5
when = { persona = ["professional", "auto"] }

[[components]]
kind = "hook"
name = "danger_zone_edit"
event = "before_tool"
match = "edit"
command = "hooks/kit/danger-zone-check.sh"
blocking = false
timeout = 5
when = { persona = ["professional", "auto"] }

[[components]]
kind = "hook"
name = "auto_lint_write"
event = "after_tool"
match = "write"
command = "hooks/kit/auto-lint.sh"
blocking = false
timeout = 15
when = { persona = ["professional", "auto", "sport"] }

[[components]]
kind = "hook"
name = "auto_lint_edit"
event = "after_tool"
match = "edit"
command = "hooks/kit/auto-lint.sh"
blocking = false
timeout = 15
when = { persona = ["professional", "auto", "sport"] }

[[components]]
kind = "hook"
name = "slop_grep_write"
event = "after_tool"
match = "write"
command = "hooks/kit/slop-grep.sh"
blocking = false
timeout = 3
when = { persona = ["professional"] }

[[components]]
kind = "hook"
name = "slop_grep_edit"
event = "after_tool"
match = "edit"
command = "hooks/kit/slop-grep.sh"
blocking = false
timeout = 3
when = { persona = ["professional"] }

[[components]]
kind = "hook"
name = "doc_slop_write"
event = "after_tool"
match = "write"
command = "hooks/kit/doc-slop-grep.sh"
blocking = false
timeout = 3
when = { persona = ["spike"] }

[[components]]
kind = "hook"
name = "review_reminder"
event = "stop"
command = "hooks/kit/session-review-reminder.sh"
blocking = false
timeout = 10
when = { persona = ["professional"] }

# ── permissions: each persona's allow and deny lists, converted to the neutral form ──
